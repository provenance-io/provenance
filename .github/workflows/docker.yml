name: Docker Build and Push
# Build & Push builds the simapp docker image on every push to master
# and pushes the image to https://hub.docker.com/u/provenanceio and ghcr.io/provenance-io/provenance
on:
  pull_request:
    paths:
      - docker/blockchain/Dockerfile
      - .github/workflows/docker.yml
      - "**.go"
      - "go.mod"
      - "go.sum"
  push:
    branches:
      - main
    tags:
      - '**'

env:
  DOCKER_IMAGE: "provenanceio/provenance"
  GHCR_IMAGE: "ghcr.io/provenance-io/provenance"

# Set concurrency for this workflow to cancel in-progress jobs if retriggered.
# The github.ref is only available when triggered by a PR so fall back to github.run_id for other cases.
# The github.run_id is unique for each run, giving each such invocation it's own unique concurrency group.
# Basically, if you push to a PR branch, jobs that are still running for that PR will be cancelled.
# But jobs started because of a merge to main or a release tag push are not cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  heighliner-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/setup-qemu-action@v4

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.DOCKER_IMAGE }}
          flavor: |
            prefix=heighliner-,onlatest=true
          tags: |
            type=edge
            type=ref,event=pr
            type=ref,event=tag

      - uses: docker/login-action@v4.6.0
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # lock to "linux/amd64" only for now since cross compilation is throwing errors
      - uses: amygdala-labs/heighliner-build-action@main
        with:
          heighliner-tag: v1.7.5
          chain: provenance
          local: true
          tag: ${{ steps.meta.outputs.version }}
          registry: provenanceio
          platform: linux/amd64
          dockerfile: cosmos
          build-target: |
            make install
          binaries: |
            - /go/bin/provenanced
          build-env: |
            - "WITH_LEDGER=false"
            - "BUILD_TAGS=muslc musl dynamic"
            - "GO_VERSION=1.25"
          skip: ${{ github.event_name == 'pull_request' }}

  docker-build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - run: go mod vendor

      - uses: docker/setup-buildx-action@v4

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=edge
            type=ref,event=pr
            type=ref,event=tag

      - uses: docker/login-action@v4.6.0
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          target: run
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          platforms: ${{ matrix.platform }}
          file: docker/blockchain/Dockerfile
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.DOCKER_IMAGE) }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docker-digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  docker:
    needs: docker-build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: docker-digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=edge
            type=ref,event=pr
            type=ref,event=tag

      - uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.DOCKER_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ env.DOCKER_IMAGE }}:${{ steps.meta.outputs.version }}

  ghcr-build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - run: go mod vendor

      - uses: docker/setup-buildx-action@v4

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=edge
            type=ref,event=pr
            type=ref,event=tag
          labels: |
            org.opencontainers.image.source=https://github.com/provenance-io/provenance
            org.opencontainers.image.description=Provenance Blockchain Node
            org.opencontainers.image.licenses=Apache-2.0

      - uses: docker/login-action@v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: 129784868+provenanceio-bot@users.noreply.github.com
          password: ${{ secrets.BOT_GHCR_PAT }}

      - name: Set platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          target: run
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          platforms: ${{ matrix.platform }}
          file: docker/blockchain/Dockerfile
          labels: ${{ steps.meta.outputs.labels }}
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.GHCR_IMAGE) }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ghcr-digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  ghcr-publish:
    needs: ghcr-build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: ghcr-digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=edge
            type=ref,event=pr
            type=ref,event=tag

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: 129784868+provenanceio-bot@users.noreply.github.com
          password: ${{ secrets.BOT_GHCR_PAT }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.GHCR_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ env.GHCR_IMAGE }}:${{ steps.meta.outputs.version }}